name: Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - name: Install Android build tools
        run: |
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"
          flutter config --jdk-dir "$JAVA_HOME"
      - name: Build and verify the arm64 APK
        run: python3 apps/android/build.py --output build/ci-android
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flashlink-android-arm64-debug
          path: build/ci-android/flashlink-arm64-debug.apk
          if-no-files-found: error
          retention-days: 7
